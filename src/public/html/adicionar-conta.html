<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Adicionar Conta</title>

    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/conta.css" />

    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  </head>

  <body>
    <div id="menu"></div>

    <main>
      <div class="container">
        <h2>
          <i class="fa-solid fa-coins"></i>
          Adicionar nova conta
        </h2>

        <form id="formConta" class="card card-formulario">
          <div class="form-grid">
            <div class="form-group">
              <label>Nome da conta</label>
              <input id="nome" required />
            </div>

            <div class="form-group">
              <label>Tipo</label>
              <select id="tipo" required>
                <option value="" selected disabled>Selecione o tipo</option>
                <option value="corrente">Corrente</option>
                <option value="credito">Crédito</option>
                <option value="investimento">Investimento</option>
              </select>
            </div>

            <div class="form-group" id="saldoInicialGroup">
              <label>Saldo inicial</label>
              <input
                id="saldoInicial"
                type="text"
                inputmode="decimal"
                data-moeda
              />
            </div>

            <div class="form-group is-hidden" id="limiteCreditoGroup">
              <label>Limite do cartão</label>
              <input
                id="limiteCredito"
                type="text"
                inputmode="decimal"
                data-moeda
              />
            </div>
          </div>

          <div class="actions-row">
            <button
              class="btn btn-primary"
              type="submit"
              data-action="salvar-redirect"
            >
              <i class="fa-solid fa-plus"></i> Adicionar conta
            </button>
            <button
              class="btn btn-primary"
              type="submit"
              data-action="salvar-adicionar-outro"
            >
              <i class="fa-solid fa-repeat"></i> Salvar e adicionar outro
            </button>
          </div>
        </form>
      </div>
    </main>

    <script type="module" src="../js/conta.js"></script>
    <script type="module" src="../js/init.js"></script>
  </body>
</html>
