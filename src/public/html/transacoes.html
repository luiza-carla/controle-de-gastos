<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Transações</title>

    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/transacoes.css" />

    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  </head>

  <body>
    <div id="menu"></div>

    <main>
      <div class="container">
        <h2>
          <i class="fa-solid fa-money-bill-transfer"></i> Gerenciar transações
        </h2>

        <div class="card card-atalho-adicionar">
          <button
            class="btn btn-primary"
            onclick="window.location.href = '/html/adicionar-transacao.html'"
          >
            <i class="fa-solid fa-plus"></i> Adicionar nova transação
          </button>
        </div>

        <hr />

        <h3><i class="fa-solid fa-list"></i> Transações</h3>

        <div class="filters-section">
          <div class="filter-group">
            <label for="filtroBuscaNomeTransacao">Buscar por nome:</label>
            <input
              type="text"
              id="filtroBuscaNomeTransacao"
              placeholder="Pesquisar transações..."
              autocomplete="off"
            />
          </div>
          <div class="filter-group">
            <label for="filtroBuscaCategoriaTransacao">Categoria:</label>
            <div class="categoria-autocomplete">
              <input
                type="text"
                id="filtroBuscaCategoriaTransacao"
                placeholder="Buscar ou selecionar categoria..."
                autocomplete="off"
              />
              <input type="hidden" id="filtroCategoriaTransacao" />
              <div
                id="filtroDropdownCategoriaTransacao"
                class="dropdown-categorias"
              ></div>
            </div>
          </div>
          <div class="filter-group">
            <label for="filtroTipoTransacao">Tipo:</label>
            <select id="filtroTipoTransacao">
              <option value="">Todos</option>
              <option value="entrada">Entrada</option>
              <option value="saida">Saída</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filtroOrdenarTransacoes">Ordenar por:</label>
            <select id="filtroOrdenarTransacoes">
              <option value="data">Data (mais recente)</option>
              <option value="nome">Nome (A-Z)</option>
            </select>
          </div>

          <div class="filtro-actions">
            <button
              id="btnLimparFiltroCategoriaTransacao"
              type="button"
              class="btn btn-secondary"
            >
              Limpar
            </button>
          </div>
        </div>

        <div id="resumoTransacoes" class="resumo-listagem">
          <span>Total estimado:</span>
          <strong id="totalTransacoes" class="resumo-listagem-valor"
            >R$ 0.00</strong
          >
        </div>

        <div id="transacoes"></div>

        <div
          id="paginationTransacoes"
          class="pagination-listagem"
          style="display: none"
        >
          <button
            id="btnAnteriorTransacoes"
            type="button"
            class="btn btn-secondary"
            disabled
          >
            Anterior
          </button>
          <span id="pageInfoTransacoes">Página 1</span>
          <button
            id="btnProximoTransacoes"
            type="button"
            class="btn btn-secondary"
          >
            Próximo
          </button>
        </div>
      </div>
    </main>

    <script type="module" src="../js/init.js"></script>
  </body>
</html>
