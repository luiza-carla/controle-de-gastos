<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Contas</title>

    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/conta.css" />

    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  </head>

  <body>
    <div id="menu"></div>

    <main>
      <div class="container">
        <h2>
          <i class="fa-solid fa-coins"></i>
          Gerenciar dinheiro
        </h2>

        <div class="card card-atalho-adicionar">
          <button
            class="btn btn-primary"
            type="button"
            data-nav-target="/html/adicionar-conta.html"
          >
            <i class="fa-solid fa-plus"></i> Adicionar nova conta
          </button>
        </div>

        <hr />

        <h3>
          <i class="fa-solid fa-wallet"></i>
          Carteira
        </h3>

        <div class="carteira-card">
          <div class="carteira-header">
            <div class="carteira-saldo" id="carteiraSaldo">R$ 0,00</div>
          </div>
          <div class="carteira-acoes">
            <button
              class="btn btn-success fullwidth"
              data-carteira-action="adicionar"
            >
              <i class="fa-solid fa-plus"></i> Adicionar
            </button>
            <button
              class="btn btn-danger fullwidth"
              data-carteira-action="remover"
            >
              <i class="fa-solid fa-minus"></i> Remover
            </button>
            <button
              class="btn btn-muted fullwidth"
              data-carteira-action="transferir"
            >
              <i class="fa-solid fa-exchange"></i> Transferir
            </button>
          </div>
        </div>

        <hr />

        <h3>
          <i class="fa-solid fa-building-columns"></i>
          Contas
        </h3>

        <div id="contas" class="contas-grid"></div>
      </div>
    </main>

    <script type="module" src="../js/init.js"></script>
    <script type="module" src="../js/carteira.js"></script>
    <script type="module" src="../js/conta.js"></script>
  </body>
</html>
