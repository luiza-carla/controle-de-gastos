<!doctype html>
<html>
  <head>
    <title>Login</title>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/modal.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>

  <body>
    <div class="container">
      <h2>Login</h2>

      <form id="formLogin">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" required />
        </div>

        <div class="form-group">
          <label for="loginSenha">Senha</label>
          <div class="password-field">
            <input id="loginSenha" type="password" required />
            <button
              type="button"
              class="password-toggle"
              data-target="loginSenha"
              aria-label="Mostrar senha"
              aria-pressed="false"
            >
              <i class="fa-regular fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button type="submit">Login</button>
      </form>

      <p>Não tem conta? <a href="../html/registrar.html">Registrar</a></p>
    </div>

    <div id="modalGlobal" class="modal-overlay is-hidden">
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="modalTitulo">Editar</h3>
        </div>

        <div id="modalErroInline" class="modal-erro-inline">
          <p id="modalMensagemErro" class="modal-mensagem-erro"></p>
        </div>

        <div id="modalConteudo"></div>

        <div class="modal-footer" id="modalFooterEditar">
          <button id="modalCancelar">
            <i class="fa-solid fa-xmark"></i> Cancelar
          </button>
          <button id="modalSalvar">
            <i class="fa-solid fa-check"></i> Salvar
          </button>
        </div>

        <div class="modal-footer is-hidden" id="modalFooterConfirmar">
          <button id="modalCancelar">
            <i class="fa-solid fa-xmark"></i> Cancelar
          </button>
          <button id="modalConfirmar" class="btn btn-danger">
            <i class="fa-solid fa-check"></i> Confirmar
          </button>
        </div>

        <div class="modal-footer is-hidden" id="modalFooterErro">
          <button id="modalFecharErro" class="btn btn-danger">
            <i class="fa-solid fa-xmark"></i> Fechar
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="../js/init.js"></script>
    <script type="module" src="../js/login.js"></script>
  </body>
</html>
